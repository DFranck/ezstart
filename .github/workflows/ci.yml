name: CI

on:
  pull_request:
    branches: [master, staging]
    paths-ignore:
      - '**/*.md'
      - 'BACKLOG.md'
      - 'BACKLOG-HISTORY.md'
      - 'docs/**'
      - '.claude/**'
  push:
    branches: [master, staging]
    paths-ignore:
      - '**/*.md'
      - 'BACKLOG.md'
      - 'BACKLOG-HISTORY.md'
      - 'docs/**'
      - '.claude/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Generator drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerate auto-generated files and fail if the committed stubs
      # drift from sources (outputs are gitignored; only the stubs/barrels
      # that re-export them are tracked).
      - name: Check generators are in sync
        run: |
          pnpm run generate
          git diff --exit-code || (echo "::error::Generator outputs drifted — run 'pnpm generate' locally and commit." && exit 1)

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Note: root engines.node pins 20.18.x for the dev environment. pnpm
      # warns but doesn't fail on Node 18/22 unless engine-strict=true (not
      # set here). The >=18.0.0 signal lives in publishable packages.
      - run: pnpm install --frozen-lockfile
      # Build packages + APIs only (webs are built by Vercel)
      - run: pnpm turbo build --filter='./packages/*' --filter='api-*' --filter='@ezbill/types' --filter='@ezbill/templates' --filter='@gacha-analyzer/types' --filter='@green-pulse/types'
      # Typecheck everything (fast, no build needed)
      - run: pnpm turbo typecheck
      - run: pnpm turbo test || true
