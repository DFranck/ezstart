name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build packages + APIs only (webs are built by Vercel)
      - run: pnpm turbo build --filter='./packages/*' --filter='api-*' --filter='@ezbill/types' --filter='@ezbill/templates' --filter='@gacha-analyzer/types' --filter='@green-pulse/types'
      # Typecheck everything (fast, no build needed)
      - run: pnpm turbo typecheck
      - run: pnpm turbo test || true
