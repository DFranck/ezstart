    startCommand: cd apps/tower-defense/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5030
      - key: MONGO_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
    autoDeploy: true
    buildFilter:
      paths:
        - apps/tower-defense/api/**
        - packages/express-core/**
        - packages/types/**
        - packages/config/**
        - packages/logger/**
      ignoredPaths:
        - apps/ezstart/**
        - apps/ezauth/**
        - apps/ezbill/**
        - apps/fengshui/**
        - apps/asc-tcd/**
        - packages/ui/**
        - packages/auth-sdk/**

