  # ======================
  # Monitoring API (Render Free)
  # ======================
  - type: web
    name: monitoring-api
    runtime: node
    region: oregon
    plan: free
    branch: master
    buildCommand: npm install -g pnpm@10.12.2 && pnpm install --frozen-lockfile --shamefully-hoist && pnpm --filter @ezstart/types --filter @ezstart/config --filter @ezstart/logger --filter @ezstart/express-core build && pnpm turbo build --filter=api-monitoring
    startCommand: cd apps/monitoring/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5080
      - key: MONGO_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HEALTH_CHECK_INTERVAL
        value: 600000  # 10 minutes
      - key: HEALTH_CHECK_TIMEOUT
        value: 5000
      - key: HEALTH_CHECK_RETRIES
        value: 3
    autoDeploy: true
    buildFilter:
      paths:
        - apps/monitoring/api/**
        - packages/express-core/**
        - packages/types/**
        - packages/config/**
        - packages/logger/**
        - packages/monitoring/**
      ignoredPaths:
        - apps/ezstart/**
        - apps/ezauth/**
        - apps/ezbill/**
        - apps/tower-defense/**
        - apps/fengshui/**
        - apps/asc-tcd/**
        - apps/green-pulse/**
        - packages/ui/**
        - packages/auth-sdk/**
