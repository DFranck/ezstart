# Render Blueprint for @ezstart monorepo
# Auto-deploy configuration for all APIs on Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ======================
  # EZBill API (Render Free)
  # ======================
  - type: web
    name: ezbill-api
    runtime: node
    region: oregon
    plan: free
    branch: master
    buildCommand: npm install -g pnpm@10.12.2 && pnpm install --frozen-lockfile --shamefully-hoist && pnpm --filter @ezstart/types --filter @ezstart/config --filter @ezstart/logger --filter @ezstart/express-core build && pnpm turbo build --filter=api-ezbill
    startCommand: cd apps/ezbill/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5020
      - key: MONGO_URL
        sync: false  # Secret - set in Render dashboard
      - key: JWT_SECRET
        sync: false  # Secret - set in Render dashboard
      - key: SENTRY_DSN
        sync: false  # Secret - set in Render dashboard
    autoDeploy: true
    # Build filters - only deploy when these paths change
    buildFilter:
      paths:
        - apps/ezbill/api/**
        - packages/express-core/**
        - packages/types/**
        - packages/config/**
        - packages/logger/**
      ignoredPaths:
        - apps/ezstart/**
        - apps/ezauth/**
        - apps/tower-defense/**
        - apps/fengshui/**
        - apps/asc-tcd/**
        - packages/ui/**
        - packages/auth-sdk/**

