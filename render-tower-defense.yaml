services:
  - type: web
    name: tower-defense-api
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter api-tower-defense
    startCommand: pnpm --filter api-tower-defense start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health