version: '3.8'

services:
  # ======================
  # EZAuth API (SSO)
  # ======================
  ezauth-api:
    build:
      context: .
      dockerfile: apps/ezauth/api/Dockerfile
    container_name: ezauth-api
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      - NODE_ENV=production
      - PORT=5010
      - MONGO_URL=${EZAUTH_MONGO_URL}
      - JWT_SECRET=${EZAUTH_JWT_SECRET}
      - GOOGLE_CLIENT_ID=${EZAUTH_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${EZAUTH_GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${EZAUTH_GOOGLE_CALLBACK_URL}
      - ALLOWED_ORIGINS=${EZAUTH_ALLOWED_ORIGINS}
      - SENTRY_DSN=${EZAUTH_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # EZPay API (Payments)
  # ======================
  ezpay-api:
    build:
      context: .
      dockerfile: apps/ezpay/api/Dockerfile
    container_name: ezpay-api
    restart: unless-stopped
    ports:
      - "5040:5040"
    environment:
      - NODE_ENV=production
      - PORT=5040
      - MONGO_URL=${EZPAY_MONGO_URL}
      - STRIPE_SECRET_KEY=${EZPAY_STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${EZPAY_STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${EZPAY_STRIPE_PUBLISHABLE_KEY}
      - WEB_URL=${EZPAY_WEB_URL}
      - SENTRY_DSN=${EZPAY_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5040/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # EZBill API (Invoicing)
  # ======================
  ezbill-api:
    build:
      context: .
      dockerfile: apps/ezbill/api/Dockerfile
    container_name: ezbill-api
    restart: unless-stopped
    ports:
      - "5020:5020"
    environment:
      - NODE_ENV=production
      - PORT=5020
      - MONGO_URL=${EZBILL_MONGO_URL}
      - JWT_SECRET=${EZBILL_JWT_SECRET}
      - SENTRY_DSN=${EZBILL_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5020/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # Tower Defense API (Game)
  # ======================
  tower-defense-api:
    build:
      context: .
      dockerfile: apps/tower-defense/api/Dockerfile
    container_name: tower-defense-api
    restart: unless-stopped
    ports:
      - "5030:5030"
    environment:
      - NODE_ENV=production
      - PORT=5030
      - MONGO_URL=${TD_MONGO_URL}
      - SENTRY_DSN=${TD_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # GreenPulse API (AI Forms)
  # ======================
  green-pulse-api:
    build:
      context: .
      dockerfile: apps/green-pulse/api/Dockerfile
    container_name: green-pulse-api
    restart: unless-stopped
    ports:
      - "5070:5070"
    environment:
      - NODE_ENV=production
      - PORT=5070
      - MONGO_URL=${GP_MONGO_URL}
      - GEMINI_API_KEY=${GP_GEMINI_API_KEY}
      - SENTRY_DSN=${GP_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5070/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # Monitoring API (Health Checks)
  # ======================
  monitoring-api:
    build:
      context: .
      dockerfile: apps/ezstart/api/Dockerfile
    container_name: monitoring-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URL=${MONITORING_MONGO_URL}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-600000}
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5000}
      - HEALTH_CHECK_RETRIES=${HEALTH_CHECK_RETRIES:-3}
      - SENTRY_DSN=${MONITORING_SENTRY_DSN}
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # Nginx Reverse Proxy
  # ======================
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-data:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - ezauth-api
      - ezpay-api
      - ezbill-api
      - tower-defense-api
      - green-pulse-api
      - monitoring-api
    networks:
      - ezstart-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================
  # Certbot (SSL/TLS - Let's Encrypt)
  # ======================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-data:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  ezstart-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-conf:
