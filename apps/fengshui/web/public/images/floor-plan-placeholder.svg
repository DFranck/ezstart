<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="#888888" stroke-width="2.5" opacity="0.4">
  <!-- Outer walls -->
  <rect x="40" y="30" width="320" height="240" rx="2" />

  <!-- Horizontal wall dividers -->
  <line x1="40" y1="150" x2="220" y2="150" />
  <line x1="260" y1="150" x2="360" y2="150" />

  <!-- Vertical wall dividers -->
  <line x1="220" y1="30" x2="220" y2="120" />
  <line x1="220" y1="180" x2="220" y2="270" />

  <!-- Interior walls -->
  <line x1="140" y1="150" x2="140" y2="270" />
  <line x1="220" y1="200" x2="360" y2="200" />

  <!-- Door arcs (quarter circles) -->
  <path d="M 220 120 A 30 30 0 0 1 250 150" stroke-dasharray="3 2" />
  <path d="M 220 180 A 30 30 0 0 0 250 150" stroke-dasharray="3 2" />
  <path d="M 140 245 A 25 25 0 0 1 165 270" stroke-dasharray="3 2" />

  <!-- Window marks -->
  <line x1="80" y1="30" x2="120" y2="30" stroke-width="3" />
  <line x1="280" y1="30" x2="330" y2="30" stroke-width="3" />
  <line x1="360" y1="80" x2="360" y2="120" stroke-width="3" />
  <line x1="40" y1="200" x2="40" y2="240" stroke-width="3" />

  <!-- Room labels (subtle) -->
  <text x="120" y="95" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">Salon</text>
  <text x="290" y="95" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">Chambre</text>
  <text x="85" y="215" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">Cuisine</text>
  <text x="180" y="215" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">SdB</text>
  <text x="290" y="180" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">Bureau</text>
  <text x="290" y="240" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.6">Entrée</text>

  <!-- Compass indicator (top right) -->
  <g transform="translate(370, 15)">
    <text x="0" y="10" font-size="10" font-family="sans-serif" fill="#888888" stroke="none" opacity="0.5">N</text>
    <line x1="4" y1="12" x2="4" y2="22" opacity="0.4" />
    <polygon points="4,12 1,18 7,18" fill="#888888" stroke="none" opacity="0.3" />
  </g>
</svg>